name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore --tool-manifest Staybnb.Web/.config/dotnet-tools.json

      - name: Restore
        run: dotnet restore Staybnb.Web/Staybnb.Web.csproj

      - name: Build
        run: dotnet build Staybnb.Web/Staybnb.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Staybnb.Web/Staybnb.Web.Tests/Staybnb.Web.Tests.csproj --configuration Release --no-build
